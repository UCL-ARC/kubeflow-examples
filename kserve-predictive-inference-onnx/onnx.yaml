apiVersion: "serving.kserve.io/v1beta1"
kind: "InferenceService"
metadata:
  annotations:
    sidecar.istio.io/inject: "false"
  name: "style-sample"
spec:
  predictor:
    model:
      args:
        - "--model-store=/mnt/models/models/mosaic/mosaic-9.onnx"
      protocolVersion: v2
      modelFormat:
        name: onnx
      storageUri: "pvc://scratch-volume"
      resources:
        requests:
          cpu: "1"
          memory: "4Gi"
        limits:
          cpu: "4"
          memory: "8Gi"