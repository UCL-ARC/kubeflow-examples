apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    sidecar.istio.io/inject: "false"
    serving.kserve.io/enable-prometheus-scraping: "true"
  name: gpt-oss-20b
spec:
  predictor:
    model:
      args:
      - --model_name=models/gpt-oss-20b
      - --model_dir=/mnt/models
      modelFormat:
        name: vllm
      resources:
        limits:
          cpu: "6"
          memory: 18Gi
          nvidia.com/gpu: "1"
          ephemeral-storage: 20Gi
        requests:
          cpu: "6"
          memory: 18Gi
          nvidia.com/gpu: "1"
          ephemeral-storage: 20Gi
      runtime: kserve-vllm
      storageUri: "pvc://scratch-volume"
