site_name: Kubeflow Trainer Examples for Unified-AI
theme:
  name: material
  logo: assets/images/kubeflow-trainer-logo.svg
  favicon: assets/images/kubeflow-trainer-logo.svg
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: fontawesome/solid/moon
        name: Switch to dark mode

    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: fontawesome/solid/sun
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
not_in_nav: |
  /stubs
copyright: "UCL Advanced Research Computing, 2026"
site_description: "Kubeflow Trainer Examples for Unified-AI"
repo_url: https://github.com/ucl-arc-environments/kubeflow-trainer-examples
edit_uri: edit/main/docs/
site_url: https://kubeflow-trainer-examples.arc-unified-ai.condenser.arc.ucl.ac.uk/docs
plugins:
  - search
  - mkdocs-nav-weight:
      section_renamed: false
      index_weight: -10
      warning: true
      reverse: false
      headless_included: false
      default_page_weight: 1000
markdown_extensions:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
