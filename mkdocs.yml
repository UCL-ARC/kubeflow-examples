site_name: Kubeflow Examples in Unified-AI
site_description: "Kubeflow Examples in Unified-AI"
site_url: https://kubeflow-examples.arc-unified-ai.condenser.arc.ucl.ac.uk/docs
repo_url: https://github.com/ucl-arc-environments/kubeflow-examples
edit_uri: edit/main/docs/
copyright: "UCL Advanced Research Computing, 2026"

theme:
  name: material
  logo: assets/images/kubeflow-trainer-logo.svg
  favicon: assets/images/kubeflow-trainer-logo.svg
  features:
    - content.action.edit
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: fontawesome/solid/moon
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: fontawesome/solid/sun
        name: Switch to light mode

plugins:
  - search
  - mkdocs-nav-weight:
      section_renamed: false
      index_weight: -10
      warning: true
      reverse: false
      headless_included: false
      default_page_weight: 1000

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg